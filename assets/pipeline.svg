<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="phase1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="phase2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <linearGradient id="phase3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <linearGradient id="phase4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle">Lumis Compiler 4-Phase Pipeline Architecture</text>

  <!-- Source Code Node -->
  <g transform="translate(40, 100)">
    <rect width="140" height="80" rx="10" fill="#334155" stroke="#64748B" stroke-width="2"/>
    <text x="70" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">Source File</text>
    <text x="70" y="58" font-family="monospace" font-size="13" fill="#38BDF8" text-anchor="middle">code.lum</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 180 140 L 210 140" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Phase 1: Lexer -->
  <g transform="translate(210, 100)">
    <rect width="140" height="80" rx="10" fill="url(#phase1)"/>
    <text x="70" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="middle">1. Lexer (Flex)</text>
    <text x="70" y="52" font-family="monospace" font-size="12" fill="#BAE6FD" text-anchor="middle">lexer.l</text>
    <text x="70" y="68" font-family="system-ui" font-size="11" fill="#E0F2FE" text-anchor="middle">Tokens Stream</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 350 140 L 380 140" stroke="#94A3B8" stroke-width="3"/>

  <!-- Phase 2: Parser -->
  <g transform="translate(380, 100)">
    <rect width="140" height="80" rx="10" fill="url(#phase2)"/>
    <text x="70" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="middle">2. Parser (Bison)</text>
    <text x="70" y="52" font-family="monospace" font-size="12" fill="#C7D2FE" text-anchor="middle">parser.y</text>
    <text x="70" y="68" font-family="system-ui" font-size="11" fill="#E0E7FF" text-anchor="middle">Abstract Syntax Tree</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 520 140 L 550 140" stroke="#94A3B8" stroke-width="3"/>

  <!-- Phase 3: Semantic Analyzer -->
  <g transform="translate(550, 100)">
    <rect width="140" height="80" rx="10" fill="url(#phase3)"/>
    <text x="70" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="middle">3. Type Checker</text>
    <text x="70" y="52" font-family="monospace" font-size="12" fill="#DDD6FE" text-anchor="middle">semantic.c</text>
    <text x="70" y="68" font-family="system-ui" font-size="11" fill="#EDE9FE" text-anchor="middle">Symbol Table</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 690 140 L 720 140" stroke="#94A3B8" stroke-width="3"/>

  <!-- Phase 4: Code Gen / Backends -->
  <g transform="translate(720, 100)">
    <rect width="140" height="80" rx="10" fill="url(#phase4)"/>
    <text x="70" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="middle">4. Code Gen</text>
    <text x="70" y="52" font-family="monospace" font-size="11" fill="#A7F3D0" text-anchor="middle">TAC / Interp / GCC</text>
    <text x="70" y="68" font-family="system-ui" font-size="11" fill="#D1FAE5" text-anchor="middle">Execution / Binary</text>
  </g>

  <!-- Output Legend -->
  <g transform="translate(150, 235)">
    <rect width="600" height="50" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="300" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#F8FAFC" text-anchor="middle">Back-End Modes</text>
    <text x="300" y="40" font-family="monospace" font-size="12" fill="#38BDF8" text-anchor="middle">[1] ./lumis code.lum (TAC)   |   [2] ./lumis -r code.lum (Run)   |   [3] ./lumis -o bin code.lum (GCC)</text>
  </g>
</svg>
